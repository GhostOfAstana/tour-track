name: Go audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath -o bin/tour-track .
      - run: go test ./internal/activity -run '^$' -fuzz FuzzScore -fuzztime 5s -parallel 2
      - run: go test ./internal/activity -run '^$' -fuzz FuzzAnalyze -fuzztime 5s -parallel 2
